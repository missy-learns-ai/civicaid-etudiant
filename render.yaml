services:
  - type: web
    runtime: python
    name: civicaid-etudiant-api
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CIVICAID_TOOL_TOKEN
        sync: false

  - type: web
    runtime: python
    name: civicaid-etudiant-dashboard
    plan: free
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: CIVICAID_API_HOST
        fromService:
          name: civicaid-etudiant-api
          type: web
          property: host
      - key: CIVICAID_API_PORT
        fromService:
          name: civicaid-etudiant-api
          type: web
          property: port
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: CIVICAID_TOOL_TOKEN
        sync: false

