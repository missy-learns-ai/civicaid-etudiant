services:
  - type: web
    runtime: python
    name: civicaid-etudiant-api
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CIVICAID_TOOL_TOKEN
        sync: false

  - type: web
    runtime: static
    name: civicaid-etudiant-dashboard
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CIVICAID_API_BASE_URL
        sync: false
      - key: VITE_ELEVENLABS_AGENT_ID
        sync: false
